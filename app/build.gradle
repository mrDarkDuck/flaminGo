import java.text.SimpleDateFormat
import java.util.Date

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.mtchecker'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.mtchecker"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Автоматическая генерация времени сборки
        def buildTime = new SimpleDateFormat("dd.MM.yyyy HH:mm").format(new Date())
        buildConfigField "String", "BUILD_TIME", "\"${buildTime}\""
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
    
    // Блок для включения BuildConfig (должен быть внутри android)
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
