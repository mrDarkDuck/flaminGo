name: Build & Release APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Важно! Нужно скачать всю историю, чтобы посчитать коммиты

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ВЫЧИСЛЯЕМ НОМЕР ВЕРСИИ ПО КОЛИЧЕСТВУ КОММИТОВ
      - name: Calculate Version Code
        id: version_code
        run: |
          # Считаем количество коммитов в текущей ветке (main)
          COUNT=$(git rev-list --count HEAD)
          echo "Computed version: $COUNT"
          echo "version_code=$COUNT" >> $GITHUB_OUTPUT

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 -c "import base64, os; open('release.keystore', 'wb').write(base64.b64decode(''.join(os.environ['KEYSTORE_BASE64'].split())))"

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # Передаем вычисленное количество коммитов вместо run_number
        run: gradle assembleRelease -PrunNumber=${{ steps.version_code.outputs.version_code }}

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/FlaminGo-v1.${{ steps.version_code.outputs.version_code }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlaminGo-v1.${{ steps.version_code.outputs.version_code }}
          path: app/build/outputs/apk/release/FlaminGo-v1.${{ steps.version_code.outputs.version_code }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ steps.version_code.outputs.version_code }}
          name: FlaminGo v1.${{ steps.version_code.outputs.version_code }}
          body_path: CHANGELOG.md
          files: app/build/outputs/apk/release/FlaminGo-v1.${{ steps.version_code.outputs.version_code }}.apk
